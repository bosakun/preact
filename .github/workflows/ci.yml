name: Validate PreAct
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  shared-runtime:
    runs-on: ubuntu-latest
    # Receipt-backed recovery/selection regressions replay complete evaluation histories.
    timeout-minutes: 180
    env:
      UV_CACHE_DIR: ${{ github.workspace }}/.cache/uv
      PREACT_MODE: local
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: python -m pip install uv==0.11.29
      - run: uv sync --frozen --extra dev --extra physical --extra sandbox
      - run: uv run ruff check src tests workers scripts
      - run: uv run ruff format --check src tests workers scripts
      - run: uv run pytest -q --durations=20
      - name: Fixed modular deliberation and independent receipt audit
        run: |
          uv run python -m scripts.bench_deliberation --protocol benchmarks/deliberation-v1.json --output .cache/deliberation-v1 --report .cache/deliberation-v1-results.json
          uv run python -m scripts.audit_deliberation --bundle .cache/deliberation-v1 --protocol benchmarks/deliberation-v1.json --results .cache/deliberation-v1-results.json --output .cache/deliberation-v1-audit.json
      - name: Fixed common cognitive learning and independent receipt audit
        run: |
          uv run python -m scripts.bench_common_learning --protocol benchmarks/common-learning-v2.json --output .cache/common-learning-v2 --report .cache/common-learning-v2-results.json
          uv run python -m scripts.audit_common_learning --bundle .cache/common-learning-v2 --output .cache/common-learning-v2-audit.json
          uv run python -m scripts.summarize_common_learning --bundle .cache/common-learning-v2 --output .cache/common-learning-v2-metrics.json
      - name: Export and audit new Queue exhibition projections
        run: |
          uv run python -m scripts.export_playground --bundle .cache/common-learning-v2 --output .cache/playground-recordings
          uv run python -m scripts.audit_playground --bundle .cache/common-learning-v2 --recordings .cache/playground-recordings --output .cache/playground-projection-audit.json
      - name: CPU source bridge across API Python 3.12 and SDK Python 3.11
        run: |
          uv venv --python 3.11 .cache/isaac-import-env
          uv pip install --python .cache/isaac-import-env/bin/python -r workers/isaac-bridge-requirements.txt numpy==1.26.4
          uv run python scripts/verify_isaac_bridge.py --python .cache/isaac-import-env/bin/python --report .cache/sdk-imports.json
      - run: npm --prefix web ci
      - run: npm --prefix web run contracts
      - name: Generated contracts are current
        run: git diff --exit-code -- web/src/contracts.schema.json web/src/contracts.ts web/src/playground.schema.json web/src/playground-contracts.ts
      - run: npm --prefix web run build
      - run: cd web && npx playwright install --with-deps chromium
      - run: npm --prefix web run test:e2e
      - name: Build with an excluded cache sentinel
        run: |
          mkdir -p .cache/archive-regression
          printf '%s\n' 'excluded-build-sentinel' > .cache/archive-regression/.env.example
          uv build --out-dir .cache/distributions
      - run: uv run python scripts/audit_distributions.py .cache/distributions --output .cache/distribution-audit.json
  blender-visual:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      UV_CACHE_DIR: ${{ github.workspace }}/.cache/uv
      PREACT_BLENDER: /tmp/blender-4.5.9-linux-x64/blender
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - run: python -m pip install uv==0.11.29
      - run: uv sync --frozen --extra dev --extra physical
      - name: Install checksum-pinned official Blender CPU binary
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-6 libxi6 libxfixes3 libxrender1 libxxf86vm1 libgl1 libegl1 libsm6
          curl --fail --location https://download.blender.org/release/Blender4.5/blender-4.5.9-linux-x64.tar.xz -o /tmp/blender.tar.xz
          echo 'dcdc3eca6c9825bb35a8033b689c053f3cb5a9b0cd2a61b2eac2a49436b4ad3d  /tmp/blender.tar.xz' | sha256sum --check
          tar -xJf /tmp/blender.tar.xz -C /tmp
          "$PREACT_BLENDER" --version
      - name: Real Blender integration tests
        run: uv run pytest -q tests/test_blender_integration.py
      - name: Frozen integration benchmark and independent replay audit
        run: |
          uv run python -m scripts.bench_blender_visual --protocol benchmarks/blender-visual-v2.json --output .cache/blender-evidence
          uv run python -m scripts.audit_blender_visual .cache/blender-evidence --output .cache/blender-evidence/audit.json
