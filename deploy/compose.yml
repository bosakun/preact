services:
  db:
    image: postgres:17.11@sha256:d74eeac9a635390a49bc21bd49fccd973de707e2a53a76ac49b552b8712ec46f
    environment:
      POSTGRES_DB: preact
      POSTGRES_USER: preact
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a database password}
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U preact -d preact"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - database:/var/lib/postgresql/data
    restart: unless-stopped
  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    env_file: ../.env
    environment:
      PREACT_DATABASE_URL: postgresql+psycopg://preact:${POSTGRES_PASSWORD}@db/preact
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - artifacts:/app/.preact
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: [CMD, /app/.venv/bin/python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
volumes:
  database:
  artifacts:
